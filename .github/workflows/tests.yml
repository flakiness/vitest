name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vitest: ['4', '5']
    runs-on: ${{ matrix.os }}
    env:
      # Gives each Vitest version its own test history on flakiness.io.
      FK_ENV_VITEST: ${{ matrix.vitest }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          standalone: true
          cache: true

      # package.json develops against Vitest 5 on Node 22. Vitest 4 on Node 20
      # is the oldest pairing the reporter supports, so switch both.
      - name: Switch to Vitest 4
        if: matrix.vitest == '4'
        shell: bash
        run: |
          pnpm runtime set node 20
          pnpm add -D vitest@^4.1.10 @vitest/browser@^4.1.10 @vitest/browser-playwright@^4.1.10 @vitest/utils@^4.1.10

      # Since tests initialize git repositories, we have
      # to configure git to avoid warnings.
      - run: git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - run: pnpm test:run
      - name: Upload Flakiness report artifact (fork PRs only)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        uses: actions/upload-artifact@v7
        with:
          name: flakiness-report-${{ github.job }}-${{ strategy.job-index }}
          path: flakiness-report/
          retention-days: 1
